<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TIMELINE — Time Correction Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* TIMELINE — editorial dossier design system
 * Newsreader (serif) + IBM Plex Mono (data). Warm paper, warm ink,
 * single bold correction-red accent. Hairline rules, generous whitespace.
 */

:root {
  --paper:    oklch(0.985 0.004 85);
  --paper-2:  oklch(0.967 0.006 84);
  --paper-3:  oklch(0.945 0.008 83);
  --ink:      oklch(0.22 0.012 60);
  --ink-2:    oklch(0.44 0.012 62);
  --ink-3:    oklch(0.62 0.010 65);
  --line:     oklch(0.885 0.006 75);
  --line-2:   oklch(0.82 0.008 72);
  --accent:   oklch(0.555 0.205 27);
  --accent-d: oklch(0.47 0.18 27);
  --accent-soft: oklch(0.95 0.045 30);
  --ok:       oklch(0.22 0.012 60); /* checks render in ink, not green */

  --serif: "Newsreader", Georgia, serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", ui-monospace, monospace;

  --maxw: 1180px;
  --r: 3px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body { min-height: 100vh; }

/* paper grain — barely-there vertical hairline texture */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image: repeating-linear-gradient(
    90deg, transparent 0 39px, oklch(0.5 0 0 / 0.015) 39px 40px);
  opacity: 0.6;
}

#root { position: relative; z-index: 1; }

::selection { background: var(--accent); color: var(--paper); }

/* ---- type ---- */
.mono { font-family: var(--mono); }
.kicker {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 500;
}
.accent { color: var(--accent); }

h1, h2, h3 { font-weight: 500; margin: 0; line-height: 1.05; }
em { font-style: italic; }
strong { font-weight: 600; }

a { color: var(--accent); text-decoration: none; }

button { font-family: var(--mono); cursor: pointer; }

/* ---- buttons ---- */
.btn {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 12px 22px;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: var(--paper);
  border-radius: var(--r);
  transition: all 0.16s ease;
}
.btn:hover { background: var(--accent); border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: 0.32; cursor: not-allowed; }
.btn[disabled]:hover { background: var(--ink); border-color: var(--ink); }

.btn-ghost {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--line-2);
}
.btn-ghost:hover { background: transparent; border-color: var(--ink); color: var(--ink); }

.btn-accent { background: var(--accent); border-color: var(--accent); }
.btn-accent:hover { background: var(--accent-d); border-color: var(--accent-d); }

.btn-sm { padding: 8px 14px; font-size: 11px; }

/* ---- layout shell ---- */
.shell { max-width: var(--maxw); margin: 0 auto; padding: 0 32px; }

.topbar {
  border-bottom: 1px solid var(--line);
  background: oklch(0.985 0.004 85 / 0.9);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 50;
}
.topbar-in {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 14px 32px;
  display: flex;
  align-items: center;
  gap: 24px;
}
.brand { display: flex; align-items: baseline; gap: 12px; }
.brand .logo {
  font-family: var(--mono);
  font-weight: 600;
  letter-spacing: 0.34em;
  font-size: 15px;
}
.brand .logo b { color: var(--accent); }
.brand .sub {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.topbar .spacer { flex: 1; }

/* ---- paradox meter ---- */
.meter { display: flex; align-items: center; gap: 10px; }
.meter .lbl {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.meter .track {
  width: 130px;
  height: 6px;
  background: var(--paper-3);
  border: 1px solid var(--line-2);
  border-radius: 6px;
  overflow: hidden;
  position: relative;
}
.meter .fill {
  height: 100%;
  background: var(--accent);
  transition: width 0.8s cubic-bezier(.2,.7,.2,1);
}
.meter .val {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  min-width: 34px;
}

/* ---- tags ---- */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-2);
  border: 1px solid var(--line-2);
  border-radius: 2px;
  padding: 3px 8px;
}
.tag.unstable { color: var(--accent); border-color: var(--accent); }

/* ---- card / panel ---- */
.panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r);
}

/* ---- divider ---- */
.rule { height: 1px; background: var(--line); border: 0; margin: 0; }

/* ---- fade transitions ---- */
.fade-in { animation: fadeIn 0.5s ease both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.rise { animation: rise 0.45s cubic-bezier(.2,.7,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--paper-2); }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 6px; border: 2px solid var(--paper-2); }
::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }

/* TIMELINE — component styles (grid, timeline, puzzle, intro, beats, epilogue) */

.stage { padding-top: 40px; padding-bottom: 96px; }

/* ============================ TOPBAR EXTRAS ============================ */
.casedots { display: flex; gap: 6px; align-items: center; }
.cdot {
  width: 26px; height: 26px; border-radius: 50%;
  border: 1px solid var(--line-2); background: transparent;
  color: var(--ink-3); font-size: 11px; font-family: var(--mono);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s ease;
}
.cdot:hover:not([disabled]) { border-color: var(--ink); color: var(--ink); }
.cdot.cur { border-color: var(--accent); color: var(--accent); }
.cdot.done { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.cdot.done.cur { background: var(--accent); border-color: var(--accent); }
.cdot[disabled] { opacity: 0.4; cursor: not-allowed; }
.reset-btn {
  background: transparent; border: 1px solid var(--line-2); color: var(--ink-3);
  width: 30px; height: 30px; border-radius: var(--r); font-size: 14px; line-height: 1;
}
.reset-btn:hover { border-color: var(--accent); color: var(--accent); }

.btn-link {
  background: transparent; border: 0; color: var(--ink-3);
  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  text-decoration: underline; text-underline-offset: 3px; padding: 8px;
}
.btn-link:hover { color: var(--accent); }

/* ============================ TRANSMISSIONS ============================ */
.tx { margin-bottom: 22px; }
.tx-from {
  font-size: 10px; letter-spacing: 0.2em; color: var(--accent);
  margin-bottom: 6px; font-weight: 500;
}
.tx-body { font-size: 18px; line-height: 1.55; color: var(--ink); max-width: 62ch; }
.tx-body .caret {
  display: inline-block; width: 8px; height: 1.1em; background: var(--accent);
  margin-left: 2px; vertical-align: -0.18em; animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.tx-channel {
  font-size: 10px; letter-spacing: 0.18em; color: var(--ink-3);
  padding-bottom: 16px; margin-bottom: 22px; border-bottom: 1px solid var(--line);
}

/* ============================ INTRO ============================ */
.intro { max-width: 860px; margin: 0 auto; }
.intro-hero { text-align: center; padding: 36px 0 52px; }
.intro-kicker {
  font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 28px;
}
.intro-title {
  font-size: clamp(64px, 13vw, 150px); font-weight: 500; letter-spacing: -0.03em;
  line-height: 0.9;
}
.intro-tagline {
  font-style: italic; font-size: clamp(18px, 2.6vw, 26px); color: var(--ink-2);
  margin-top: 22px;
}
.intro-transmission { padding: 32px 36px; }
.beat-panel { max-width: 760px; margin: 40px auto; }
.intro-cta {
  display: flex; align-items: center; gap: 18px; margin-top: 16px;
  opacity: 0; transform: translateY(8px); pointer-events: none;
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.intro-cta.ready { opacity: 1; transform: none; pointer-events: auto; }
.beat { min-height: 50vh; display: flex; align-items: center; }
.beat-panel { width: 100%; }

/* ============================ PUZZLE HEAD ============================ */
.pv-head { max-width: 760px; margin: 0 auto 44px; }
.pv-meta {
  display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
  font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 18px;
}
.pv-code { color: var(--accent); font-weight: 600; }
.pv-tier { color: var(--ink-2); }
.pv-era { color: var(--ink-3); margin-left: auto; }
.pv-title { font-size: clamp(38px, 6vw, 62px); font-weight: 500; letter-spacing: -0.02em; line-height: 1; }
.pv-place { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin-top: 14px; }
.pv-scenario { margin-top: 26px; }
.pv-scenario p {
  font-size: 18.5px; line-height: 1.62; color: var(--ink); margin: 0 0 16px;
  text-wrap: pretty;
}
.pv-scenario p:first-of-type::first-letter {
  font-size: 3.4em; float: left; line-height: 0.78; padding: 6px 12px 0 0; color: var(--accent); font-weight: 500;
}

/* ============================ PUZZLE BODY GRID ============================ */
.pv-body { display: grid; grid-template-columns: minmax(280px, 34%) 1fr; gap: 40px; align-items: start; }
.pv-section-h {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-2);
  padding-bottom: 12px; border-bottom: 1px solid var(--ink); margin-bottom: 18px; font-weight: 500;
}
.pv-count { color: var(--ink-3); font-weight: 400; }

/* ---- clues ---- */
.pv-clues { position: sticky; top: 88px; }
.cluelist { list-style: none; margin: 0 0 36px; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.clue { padding: 14px 0; border-bottom: 1px solid var(--line); }
.clue.unstable { background: var(--accent-soft); margin: 0 -14px; padding: 14px; border-bottom-color: transparent; border-radius: var(--r); }
.clue-top { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
.clue-n { font-size: 12px; color: var(--ink-3); font-weight: 500; }
.clue-text { margin: 0; font-size: 15.5px; line-height: 1.5; color: var(--ink); text-wrap: pretty; }
.clue.unstable .clue-text { color: var(--accent-d); }

/* ---- hints ---- */
.hintbox { margin-top: 8px; }
.hint { padding: 12px 14px; background: var(--paper-2); border-left: 2px solid var(--ink); margin-bottom: 10px; border-radius: 0 var(--r) var(--r) 0; }
.hint-lbl { display: block; font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin-bottom: 5px; }
.hint p { margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--ink-2); }
.hint-btn { width: 100%; justify-content: center; margin-bottom: 10px; }
.hint-exhausted { font-size: 11px; color: var(--ink-3); letter-spacing: 0.06em; margin-top: 4px; }

/* ============================ WORKSPACE ============================ */
.pv-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; }
.seg button {
  background: transparent; border: 0; padding: 9px 16px; font-size: 11px;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3);
  border-right: 1px solid var(--line-2);
}
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--ink); color: var(--paper); }
.seg button:hover:not(.on) { color: var(--ink); }

/* ============================ LOGIC GRID ============================ */
.grid-wrap { margin-bottom: 36px; }
.grid-blocks { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; }
.gblock { overflow-x: auto; }
.gtable { border-collapse: collapse; font-family: var(--mono); }
.gtable th, .gtable td { border: 1px solid var(--line-2); }
.gcorner {
  background: var(--paper-2); padding: 6px 8px; text-align: left; vertical-align: bottom;
  font-size: 8.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3);
  line-height: 1.4; min-width: 78px;
}
.gcorner .ga { display: block; color: var(--ink-2); }
.gcorner .gx { color: var(--accent); }
.gcorner .gb { display: block; color: var(--ink-2); }
.gcolh {
  height: 96px; vertical-align: bottom; padding: 7px 0; background: var(--paper-2); width: 30px;
}
.gcolh span {
  writing-mode: vertical-rl; transform: rotate(180deg); display: inline-block;
  white-space: nowrap; font-size: 10.5px; color: var(--ink-2); letter-spacing: 0.02em;
}
.growh {
  background: var(--paper-2); text-align: right; padding: 0 10px; font-size: 10.5px;
  color: var(--ink-2); white-space: nowrap; height: 30px; letter-spacing: 0.02em;
}
.gcell {
  width: 30px; height: 30px; min-width: 30px; text-align: center; cursor: pointer;
  background: var(--paper); transition: background 0.1s ease; position: relative; user-select: none;
}
.gcell:hover { background: var(--paper-3); }
.gcell.is-yes { background: oklch(0.22 0.012 60 / 0.06); }
.gcell.is-no { background: var(--accent-soft); }
.mk-yes { color: var(--ink); font-size: 15px; font-weight: 600; }
.mk-no { color: var(--accent); font-size: 13px; }

.grid-legend {
  display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; margin-top: 20px;
  font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em;
}
.grid-legend span { display: inline-flex; align-items: center; gap: 7px; }
.lg-cell {
  width: 20px; height: 20px; border: 1px solid var(--line-2); display: inline-flex;
  align-items: center; justify-content: center; border-radius: 2px;
}
.lg-cell .mk-yes { font-size: 12px; }
.lg-cell .mk-no { font-size: 11px; }
.lg-hint { color: var(--ink-3); font-style: normal; margin-left: auto; }

/* ============================ TIMELINE VIZ ============================ */
.tlviz { margin-bottom: 36px; border: 1px solid var(--line); border-radius: var(--r); padding: 24px; background: var(--paper-2); }
.tlviz-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
.tlviz-state { font-size: 11px; letter-spacing: 0.1em; color: var(--accent); }
.tlviz.solved .tlviz-state { color: var(--ink-2); }
.tlviz-track { position: relative; display: grid; grid-template-columns: repeat(var(--cols), 1fr); min-height: 300px; }
.tlviz-axis {
  position: absolute; left: 0; right: 0; top: 50%; height: 0;
  border-top: 1px dashed var(--line-2);
}
.tlviz.solved .tlviz-axis { border-top-style: solid; border-top-color: var(--ink); }
.tlviz-node { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.tlviz-slot { height: 120px; display: flex; align-items: flex-end; justify-content: center; width: 100%; padding: 0 6px; }
.tlviz-slot.bot { align-items: flex-start; }
.tlviz-dot {
  width: 11px; height: 11px; border-radius: 50%; background: var(--paper);
  border: 2px solid var(--ink); z-index: 2; margin: 6px 0;
}
.tlviz-dot.is-div { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }
.tlviz-year { font-size: 13px; color: var(--ink); font-weight: 500; letter-spacing: 0.06em; }
.tlviz-card {
  border: 1px solid var(--line-2); background: var(--paper); border-radius: var(--r);
  padding: 9px 11px; min-width: 120px; max-width: 150px;
}
.tlviz-card.is-div { border-color: var(--accent); background: var(--paper); }
.tlviz-attr { display: flex; flex-direction: column; margin-bottom: 6px; }
.tlviz-attr:last-of-type { margin-bottom: 0; }
.tlviz-cat { font-size: 8.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.tlviz-val { font-size: 14px; color: var(--ink); line-height: 1.2; }
.tlviz-val.unknown { color: var(--line-2); }
.tlviz-divtag { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--accent-soft); }

/* ============================ ANSWER PANEL ============================ */
.answer { margin-top: 8px; }
.answer.shake { animation: shake 0.45s ease; }
@keyframes shake { 0%,100%{transform:none} 20%{transform:translateX(-7px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)} }
.ans-table-wrap { overflow-x: auto; }
.ans-table { width: 100%; border-collapse: collapse; }
.ans-table th, .ans-table td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); }
.ans-table thead th { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
.ans-anchor { font-size: 14px; color: var(--ink); font-weight: 500; white-space: nowrap; }
.ans-st { width: 30px; text-align: center; }
.ans-table select {
  font-family: var(--serif); font-size: 14.5px; color: var(--ink); background: var(--paper);
  border: 1px solid var(--line-2); border-radius: 2px; padding: 6px 8px; width: 100%; min-width: 110px;
}
.ans-table select:focus { outline: none; border-color: var(--accent); }
.ans-locked { font-size: 14.5px; color: var(--ink); }
.ans-table tr.ok th, .ans-table tr.ok td { background: oklch(0.22 0.012 60 / 0.04); }
.ans-table tr.bad th, .ans-table tr.bad td { background: var(--accent-soft); }
.ans-actions { display: flex; align-items: center; gap: 18px; margin-top: 20px; flex-wrap: wrap; }
.ans-feedback { font-size: 11.5px; color: var(--accent); letter-spacing: 0.04em; }

/* ============================ SOLUTION ============================ */
.solution { margin-top: 44px; padding-top: 36px; border-top: 2px solid var(--ink); }
.sol-tag { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink); margin-bottom: 22px; }
.divergence { display: flex; gap: 22px; align-items: stretch; background: var(--ink); color: var(--paper); border-radius: var(--r); padding: 24px 26px; margin-bottom: 30px; }
.div-yr { font-size: 30px; font-weight: 600; color: var(--paper); white-space: nowrap; align-self: center; }
.div-body { border-left: 1px solid oklch(1 0 0 / 0.2); padding-left: 22px; }
.div-lbl { font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: oklch(1 0 0 / 0.5); margin-bottom: 8px; }
.div-body p { margin: 0; font-size: 16px; line-height: 1.55; color: oklch(1 0 0 / 0.92); }
.sol-rule, .sol-explain, .sol-walk { margin-bottom: 28px; }
.sol-rule .kicker, .sol-explain .kicker, .sol-walk .kicker { display: block; margin-bottom: 12px; }
.sol-hidden { font-size: 17px; font-style: italic; line-height: 1.5; color: var(--ink); margin: 0; max-width: 64ch; }
.sol-explain p { font-size: 16px; line-height: 1.62; color: var(--ink); margin: 0 0 14px; max-width: 66ch; text-wrap: pretty; }
.sol-walk ol { margin: 0; padding-left: 0; list-style: none; counter-reset: w; max-width: 66ch; }
.sol-walk li { counter-increment: w; position: relative; padding: 9px 0 9px 40px; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 1.5; font-family: var(--mono); }
.sol-walk li::before { content: counter(w, decimal-leading-zero); position: absolute; left: 0; top: 9px; color: var(--accent); font-size: 12px; font-weight: 600; }
.sol-next { margin-top: 16px; }

/* ============================ EPILOGUE ============================ */
.epilogue { min-height: 64vh; display: flex; align-items: center; justify-content: center; }
.epi-card { max-width: 680px; text-align: center; }
.epi-kicker { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 28px; }
.epi-title { font-size: clamp(36px, 6vw, 58px); font-weight: 500; letter-spacing: -0.02em; line-height: 1.05; margin-bottom: 30px; }
.epi-body { font-size: 18px; line-height: 1.6; color: var(--ink-2); margin: 0 auto 18px; max-width: 56ch; }
.epi-dim { color: var(--ink-3); font-style: italic; }
.epi-actions { display: flex; gap: 16px; justify-content: center; margin-top: 36px; flex-wrap: wrap; }
.epi-foot { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-3); margin-top: 48px; }

/* ============================ RESPONSIVE ============================ */
@media (max-width: 860px) {
  .shell { padding: 0 20px; }
  .topbar-in { padding: 12px 20px; gap: 14px; }
  .brand .sub { display: none; }
  .pv-body { grid-template-columns: 1fr; gap: 30px; }
  .pv-clues { position: static; }
  .meter .track { width: 80px; }
  .pv-scenario p:first-of-type::first-letter { font-size: 2.8em; }
  .divergence { flex-direction: column; gap: 14px; }
  .div-body { border-left: 0; border-top: 1px solid oklch(1 0 0 / 0.2); padding-left: 0; padding-top: 14px; }
}
@media (max-width: 520px) {
  .casedots { display: none; }
  .lg-hint { margin-left: 0; flex-basis: 100%; }
}

/* ============================ TOPBAR BRAND BUTTON ============================ */
.brand-btn { background: transparent; border: 0; padding: 0; cursor: pointer; text-align: left; }
.brand-btn:hover .logo b { color: var(--accent-d); }
.idx-btn { white-space: nowrap; }
.cur-case { font-size: 11px; letter-spacing: 0.14em; color: var(--accent); border: 1px solid var(--line-2); padding: 5px 10px; border-radius: var(--r); }

/* ============================ CASE INDEX ============================ */
.caseindex { max-width: 980px; margin: 0 auto; }
.ci-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-bottom: 24px; margin-bottom: 8px; border-bottom: 2px solid var(--ink); }
.ci-kicker { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 12px; }
.ci-title { font-size: clamp(40px, 7vw, 72px); font-weight: 500; letter-spacing: -0.02em; line-height: 0.95; }
.ci-progress { text-align: right; flex-shrink: 0; }
.ci-prog-num { font-size: 26px; color: var(--ink); }
.ci-prog-num b { color: var(--accent); font-weight: 600; }
.ci-prog-lbl { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); margin-top: 4px; }

.ci-epilogue {
  display: flex; flex-direction: column; gap: 6px; width: 100%; text-align: left;
  background: var(--ink); color: var(--paper); border: 0; border-radius: var(--r);
  padding: 20px 24px; margin: 28px 0 8px; cursor: pointer; transition: background 0.16s ease;
}
.ci-epilogue:hover { background: var(--accent); }
.ci-epilogue .mono { font-size: 10px; letter-spacing: 0.2em; color: oklch(1 0 0 / 0.55); }
.ci-epi-title { font-size: 20px; }

.ci-tier { margin-top: 40px; }
.ci-tier.sealed { opacity: 0.66; }
.ci-tier-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.ci-tier-name { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink); font-weight: 600; }
.ci-tier-note { font-size: 14px; color: var(--ink-3); font-style: italic; margin-left: 14px; }
.ci-tier-count { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }

.ci-rows { display: flex; flex-direction: column; }
.case-row {
  display: grid; grid-template-columns: 110px 1fr auto auto; align-items: center; gap: 20px;
  width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line);
  padding: 16px 8px; cursor: pointer; transition: background 0.13s ease, padding 0.13s ease;
}
.case-row:hover:not(.locked) { background: var(--paper-2); padding-left: 14px; padding-right: 14px; }
.case-row.locked { cursor: not-allowed; opacity: 0.5; }
.cr-code { font-size: 12px; letter-spacing: 0.08em; color: var(--accent); }
.case-row.locked .cr-code { color: var(--ink-3); }
.cr-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cr-title { font-size: 19px; color: var(--ink); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.cr-prio { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); padding: 2px 7px; border-radius: 2px; }
.cr-place { font-size: 12px; letter-spacing: 0.04em; color: var(--ink-3); }
.cr-meta { display: flex; gap: 8px; }
.cr-chip { font-size: 10px; letter-spacing: 0.06em; color: var(--ink-2); border: 1px solid var(--line-2); padding: 3px 8px; border-radius: 2px; white-space: nowrap; }
.cr-status { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; min-width: 80px; text-align: right; }
.case-row.solved .cr-status { color: var(--ink); }
.case-row.solved .cr-title { color: var(--ink-2); }
.case-row:hover:not(.locked) .cr-status { color: var(--accent); }

.ci-foot { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); text-align: center; }

@media (max-width: 720px) {
  .ci-head { flex-direction: column; align-items: flex-start; gap: 16px; }
  .ci-progress { text-align: left; }
  .case-row { grid-template-columns: 1fr auto; gap: 6px 14px; }
  .cr-code { grid-column: 1; }
  .cr-status { grid-column: 2; grid-row: 1; }
  .cr-main { grid-column: 1 / -1; }
  .cr-meta { grid-column: 1 / -1; }
  .ci-tier-note { display: none; }
}

<script type="text/babel" data-presets="react">
/* TIMELINE — shared UI atoms */

const { useState, useEffect, useRef } = React;

/* Paradox / instability meter (lives in the topbar) */
function ParadoxMeter({ value }) {
  const v = Math.max(0, Math.min(100, Math.round(value)));
  return (
    <div className="meter" title="Local timeline instability">
      <span className="lbl">Paradox</span>
      <div className="track"><div className="fill" style={{ width: v + "%" }} /></div>
      <span className="val">{v}%</span>
    </div>
  );
}

/* A single transmission line from CONTROL, typed in. */
function Transmission({ from, text, delay = 0, onDone, instant = false }) {
  const [shown, setShown] = useState(instant ? text : "");
  const [done, setDone] = useState(instant);
  const [started, setStarted] = useState(instant);

  useEffect(() => {
    if (instant) { onDone && onDone(); return; }
    const t = setTimeout(() => setStarted(true), delay);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => {
    if (!started || instant) return;
    let i = 0;
    const plain = text;
    const id = setInterval(() => {
      i += 2;
      setShown(plain.slice(0, i));
      if (i >= plain.length) {
        clearInterval(id);
        setShown(plain);
        setDone(true);
        onDone && onDone();
      }
    }, 12);
    return () => clearInterval(id);
  }, [started]);

  if (!started) return null;

  return (
    <div className="tx rise">
      <div className="tx-from mono">{from}</div>
      <div className="tx-body" dangerouslySetInnerHTML={{ __html: shown + (done ? "" : "<span class='caret'></span>") }} />
    </div>
  );
}

/* A sequence of transmissions that reveal one after another. */
function TransmissionLog({ lines, onComplete }) {
  const [revealed, setRevealed] = useState(1);
  const endRef = useRef(null);

  useEffect(() => {
    if (revealed >= lines.length) { onComplete && onComplete(); }
  }, [revealed]);

  return (
    <div className="tx-log">
      {lines.slice(0, revealed).map((l, i) => (
        <Transmission
          key={i}
          from={l.from}
          text={l.text}
          onDone={() => { if (i === revealed - 1 && revealed < lines.length) {
            setTimeout(() => setRevealed((r) => r + 1), 360);
          } }}
        />
      ))}
      <div ref={endRef} />
    </div>
  );
}

Object.assign(window, { ParadoxMeter, Transmission, TransmissionLog });

/* TIMELINE — LogicGrid: generic pairwise deduction grid.
 * marks[pairKey][aId][bId] = 0 (blank) | 1 (true / ✓) | 2 (ruled out / ✗)
 * pairKey = `${catA.id}__${catB.id}` (catA precedes catB in puzzle order)
 */

function pairKey(aId, bId) { return aId + "__" + bId; }

function buildPairs(categories) {
  const pairs = [];
  for (let i = 0; i < categories.length; i++)
    for (let j = i + 1; j < categories.length; j++)
      pairs.push([categories[i], categories[j]]);
  return pairs;
}

function LogicGrid({ puzzle, marks, setMarks }) {
  const pairs = buildPairs(puzzle.categories);

  function cycle(pk, aId, bId) {
    setMarks((prev) => {
      const next = JSON.parse(JSON.stringify(prev || {}));
      next[pk] = next[pk] || {};
      next[pk][aId] = next[pk][aId] || {};
      const cur = next[pk][aId][bId] || 0;
      const val = (cur + 1) % 3;
      next[pk][aId][bId] = val;

      // auto-eliminate the row & column within this sub-grid on a ✓
      if (val === 1) {
        const [catA, catB] = pairs.find(([a, b]) => pairKey(a.id, b.id) === pk);
        catB.items.forEach((b) => {
          if (b.id !== bId) {
            next[pk][aId][b.id] = next[pk][aId][b.id] === 1 ? 1 : 2;
          }
        });
        catA.items.forEach((a) => {
          if (a.id !== aId) {
            next[pk][a.id] = next[pk][a.id] || {};
            next[pk][a.id][bId] = next[pk][a.id][bId] === 1 ? 1 : 2;
          }
        });
      }
      return next;
    });
  }

  return (
    <div className="grid-wrap">
      <div className="grid-blocks">
        {pairs.map(([catA, catB]) => {
          const pk = pairKey(catA.id, catB.id);
          return (
            <div className="gblock" key={pk}>
              <table className="gtable">
                <thead>
                  <tr>
                    <th className="gcorner">
                      <span className="ga">{catA.name}</span>
                      <span className="gx">×</span>
                      <span className="gb">{catB.name}</span>
                    </th>
                    {catB.items.map((b) => (
                      <th className="gcolh" key={b.id}>
                        <span>{b.label}</span>
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {catA.items.map((a) => (
                    <tr key={a.id}>
                      <th className="growh">{a.label}</th>
                      {catB.items.map((b) => {
                        const v = (marks[pk] && marks[pk][a.id] && marks[pk][a.id][b.id]) || 0;
                        return (
                          <td
                            key={b.id}
                            className={"gcell" + (v === 1 ? " is-yes" : v === 2 ? " is-no" : "")}
                            onClick={() => cycle(pk, a.id, b.id)}
                          >
                            {v === 1 ? <span className="mk-yes">✓</span>
                              : v === 2 ? <span className="mk-no">✕</span> : null}
                          </td>
                        );
                      })}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          );
        })}
      </div>
      <div className="grid-legend mono">
        <span><i className="lg-cell" /> unknown</span>
        <span><i className="lg-cell"><b className="mk-yes">✓</b></i> confirmed true</span>
        <span><i className="lg-cell"><b className="mk-no">✕</b></i> ruled out</span>
        <span className="lg-hint">click a cell to cycle · a ✓ auto-rules-out its row &amp; column</span>
      </div>
    </div>
  );
}

Object.assign(window, { LogicGrid, pairKey, buildPairs });

/* TIMELINE — TimelineViz: live chronological visualization of confirmed marks.
 * Anchor category = categories[0]; its items are listed in chronological order.
 * For each anchor item we surface whatever the player has confirmed (✓).
 */

function TimelineViz({ puzzle, marks, solved }) {
  const cats = puzzle.categories;
  const anchor = cats[0];
  const others = cats.slice(1);

  function confirmedFor(anchorItemId, otherCat) {
    const pk = pairKey(anchor.id, otherCat.id);
    const row = marks[pk] && marks[pk][anchorItemId];
    if (!row) return null;
    const hit = otherCat.items.find((it) => row[it.id] === 1);
    return hit || null;
  }

  const divLabel = puzzle.divergence.year;

  return (
    <div className={"tlviz" + (solved ? " solved" : "")}>
      <div className="tlviz-head mono">
        <span className="kicker">Timeline Visualization</span>
        <span className="tlviz-state">
          {solved ? "● restored — chain stable" : "● reconstructing — confirmed links only"}
        </span>
      </div>

      <div className="tlviz-track" style={{ "--cols": anchor.items.length }}>
        <div className="tlviz-axis" />
        {anchor.items.map((yr, i) => {
          const above = i % 2 === 0;
          const isDiv = solved && yr.label === divLabel;
          const card = (
            <div className={"tlviz-card" + (isDiv ? " is-div" : "")}>
              {others.map((c) => {
                const hit = confirmedFor(yr.id, c);
                return (
                  <div className="tlviz-attr" key={c.id}>
                    <span className="tlviz-cat mono">{c.name}</span>
                    <span className={"tlviz-val" + (hit ? "" : " unknown")}>
                      {hit ? hit.label : "—"}
                    </span>
                  </div>
                );
              })}
              {isDiv && <div className="tlviz-divtag mono">⚠ Divergence point</div>}
            </div>

          return (
            <div className={"tlviz-node" + (above ? " above" : " below")} key={yr.id}>

              <div className={"tlviz-dot" + (isDiv ? " is-div" : "")} />
              <div className="tlviz-year mono">{yr.label}</div>
              <div className="tlviz-slot bot">{!above ? card : null}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* TIMELINE — PuzzleView: one full case (scenario, clues, grid, hints, answer, solution) */

function PuzzleView(props) {
  const { puzzle, marks, setMarks, hintsUsed, onUseHint,
          solved, onSolve, finalSel, setFinalSel, onAdvance, onWrong, isLast, isStory } = props;

  const [view, setView] = useState("grid");           // grid | timeline
  const [submitted, setSubmitted] = useState(solved);
  const [rowResults, setRowResults] = useState(null);
  const [revealed, setRevealed] = useState(solved);
  const [shake, setShake] = useState(false);

  const cats = puzzle.categories;
  const anchor = cats[0];
  const others = cats.slice(1);

  // solution lookup: byAnchor[anchorItemId][catId] = itemId
  const byAnchor = {};
  puzzle.solution.forEach((row) => {
    byAnchor[row[anchor.id]] = row;
  });

  function setSel(anchorId, catId, val) {
    const next = JSON.parse(JSON.stringify(finalSel || {}));
    next[anchorId] = next[anchorId] || {};
    next[anchorId][catId] = val;
    setFinalSel(next);
  }

  function pullFromGrid() {
    const next = JSON.parse(JSON.stringify(finalSel || {}));
    anchor.items.forEach((a) => {
      next[a.id] = next[a.id] || {};
      others.forEach((c) => {
        const pk = pairKey(anchor.id, c.id);
        const row = marks[pk] && marks[pk][a.id];
        if (row) {
          const hit = c.items.filter((it) => row[it.id] === 1);
          if (hit.length === 1) next[a.id][c.id] = hit[0].id;
        }
      });
    });
    setFinalSel(next);
  }

  function allFilled() {
    return anchor.items.every((a) =>
      others.every((c) => finalSel[a.id] && finalSel[a.id][c.id]));
  }

  function submit() {
    const results = anchor.items.map((a) => {
      const correct = others.every((c) => finalSel[a.id] && finalSel[a.id][c.id] === byAnchor[a.id][c.id]);
      return { id: a.id, correct };
    });
    setRowResults(results);
    setSubmitted(true);
    const allCorrect = results.every((r) => r.correct);
    if (allCorrect) {
      setRevealed(true);
      onSolve();
    } else {
      setShake(true);
      setTimeout(() => setShake(false), 500);
      onWrong();
    }
  }

  function giveUp() {
    // fill selects with the solution, reveal
    const next = {};
    anchor.items.forEach((a) => {
      next[a.id] = {};
      others.forEach((c) => { next[a.id][c.id] = byAnchor[a.id][c.id]; });
    });
    setFinalSel(next);
    setRevealed(true);
    setSubmitted(true);
    setRowResults(anchor.items.map((a) => ({ id: a.id, correct: true })));
    onSolve(true);
  }

  const tier = window.TIMELINE.TIER[puzzle.tier];
  const labelFor = (catId, itemId) => {
    const c = cats.find((x) => x.id === catId);
    const it = c.items.find((x) => x.id === itemId);
    return it ? it.label : "";
  };

  return (
    <div className="pv fade-in">
      {/* ---- scenario header ---- */}
      <header className="pv-head">
        <div className="pv-meta mono">
          <span className="pv-code">{puzzle.code}</span>
          <span className="pv-tier">{tier.label} · {tier.name}</span>
          <span className="pv-era">{puzzle.eraLabel}</span>
        </div>
        <h1 className="pv-title">{puzzle.title}</h1>
        <div className="pv-place mono">{puzzle.place}</div>
        <div className="pv-scenario">
          {puzzle.scenario.map((p, i) => (
            <p key={i} dangerouslySetInnerHTML={{ __html: p }} />
          ))}
        </div>
      </header>

      <div className="pv-body">
        {/* ---- left: clues + hints ---- */}
        <aside className="pv-clues">
          <div className="pv-section-h mono">
            <span>Evidence</span><span className="pv-count">{puzzle.clues.length} records</span>
          </div>
          <ol className="cluelist">
            {puzzle.clues.map((c, i) => (
              <li key={i} className={"clue" + (c.unstable ? " unstable" : "")}>
                <div className="clue-top">
                  <span className="clue-n mono">{String(i + 1).padStart(2, "0")}</span>
                  <span className={"tag" + (c.unstable ? " unstable" : "")}>
                    {c.unstable ? "⚠ Unstable" : c.type}
                  </span>
                </div>
                <p className="clue-text" dangerouslySetInnerHTML={{ __html: c.text }} />
              </li>
            ))}
          </ol>

          <div className="hintbox">
            <div className="pv-section-h mono"><span>Agency Hints</span></div>
            {[0, 1, 2].map((i) => {
              const titles = ["Gentle nudge", "Structural hint", "Near-solution"];
              if (i < hintsUsed) {
                return (
                  <div className="hint revealed rise" key={i}>
                    <span className="hint-lbl mono">{titles[i]}</span>
                    <p>{puzzle.hints[i]}</p>
                  </div>
                );
              }
              if (i === hintsUsed) {
                return (
                  <button className="btn btn-ghost btn-sm hint-btn" key={i} onClick={onUseHint}>
                    Request {titles[i].toLowerCase()} →
                  </button>
                );
              }
              return null;
            })}
            {hintsUsed >= 3 && <p className="hint-exhausted mono">All hints disclosed. Instability rising.</p>}
          </div>
        </aside>

        {/* ---- right: workspace ---- */}
        <section className="pv-work">
          <div className="pv-toolbar">
            <div className="seg mono">
              <button className={view === "grid" ? "on" : ""} onClick={() => setView("grid")}>Deduction Grid</button>
              <button className={view === "timeline" ? "on" : ""} onClick={() => setView("timeline")}>Timeline View</button>
            </div>
            <button className="btn btn-ghost btn-sm" onClick={() => {
              if (confirm("Clear all grid marks for this case?")) setMarks(() => ({}));
            }}>Clear grid</button>
          </div>

          {view === "grid"
            ? <LogicGrid puzzle={puzzle} marks={marks} setMarks={setMarks} />
            : <TimelineViz puzzle={puzzle} marks={marks} solved={revealed} />}

          {/* ---- final answer ---- */}
          <div className={"answer" + (shake ? " shake" : "")}>
            <div className="pv-section-h mono">
              <span>Restore the Timeline</span>
              {!revealed && <button className="btn btn-ghost btn-sm" onClick={pullFromGrid}>Fill from grid ↥</button>}
            </div>
            <div className="ans-table-wrap">
              <table className="ans-table">
                <thead>
                  <tr>
                    <th className="mono">{anchor.name}</th>
                    {others.map((c) => <th key={c.id} className="mono">{c.name}</th>)}
                    {submitted && <th className="mono ans-st">✓</th>}
                  </tr>
                </thead>
                <tbody>
                  {anchor.items.map((a) => {
                    const res = rowResults && rowResults.find((r) => r.id === a.id);
                    return (
                      <tr key={a.id} className={res ? (res.correct ? "ok" : "bad") : ""}>
                        <th className="mono ans-anchor">{a.label}</th>
                        {others.map((c) => (
                          <td key={c.id}>
                            {revealed ? (
                              <span className="ans-locked">{labelFor(c.id, byAnchor[a.id][c.id])}</span>
                            ) : (
                              <select
                                value={(finalSel[a.id] && finalSel[a.id][c.id]) || ""}
                                onChange={(e) => setSel(a.id, c.id, e.target.value)}
                              >
                                <option value="">— select —</option>
                                {c.items.map((it) => (
                                  <option key={it.id} value={it.id}>{it.label}</option>
                                ))}
                              </select>
                            )}
                          </td>
                        ))}
                        {submitted && (
                          <td className="ans-st">{res && res.correct ? "✓" : <span className="accent">✕</span>}</td>
                        )}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            {!revealed && (
              <div className="ans-actions">
                <button className="btn btn-accent" disabled={!allFilled()} onClick={submit}>
                  Submit reconstruction
                </button>
                <button className="btn-link mono" onClick={giveUp}>Reveal solution</button>
                {submitted && rowResults && !rowResults.every((r) => r.correct) && (
                  <span className="ans-feedback mono">
                    {rowResults.filter((r) => r.correct).length}/{anchor.items.length} rows correct — paradox deepening
                  </span>
                )}
              </div>
            )}
          </div>

          {/* ---- solution ---- */}
          {revealed && (
            <div className="solution rise">
              <div className="sol-tag mono">▣ Timeline restored</div>
              <div className="divergence">
                <div className="div-yr mono">{puzzle.divergence.year}</div>
                <div className="div-body">
                  <div className="div-lbl mono">Divergence point · keystone</div>
                  <p>{puzzle.divergence.text}</p>
                </div>
              </div>

              <div className="sol-rule">
                <span className="kicker">Hidden rule</span>
                <p className="sol-hidden">{puzzle.hiddenRule}</p>
              </div>

              <div className="sol-explain">
                <span className="kicker">Reconstruction</span>
                {puzzle.explanation.map((p, i) => (
                  <p key={i} dangerouslySetInnerHTML={{ __html: p }} />
                ))}
              </div>

              <div className="sol-walk">
                <span className="kicker">Reasoning walkthrough</span>
                <ol>{puzzle.walkthrough.map((s, i) => <li key={i}>{s}</li>)}</ol>
              </div>

              <button className="btn btn-accent sol-next" onClick={onAdvance}>
                {isStory ? (isLast ? "Transmit findings to Control →" : "File report · receive directive →") : "Return to Case Index →"}
              </button>
            </div>
          )}
        </section>
      </div>
    </div>
  );
}

Object.assign(window, { PuzzleView });


/* === */

/* TIMELINE — App orchestrator: intro → Case Index → puzzles → beats → epilogue */

const TL = window.TIMELINE;
const SAVE_KEY = "timeline.save.v3";
const TIER_META = {
  1: { label: "Tier I", name: "Minor Distortions", note: "Single-change fractures. Direct records, clean elimination." },
  2: { label: "Tier II", name: "Multi-Event Divergence", note: "Conflicting anomalies share an era. Cross-reference to resolve." },
  3: { label: "Tier III", name: "Collapse Events", note: "Relational logic only — and one record in each case is a lie." },
};

function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && s.save) return s;
  } catch (e) {}
  return { phase: "intro", currentId: null,
    save: { marks: {}, hints: {}, wrong: {}, solved: {}, final: {} } };
}

const isStory = (p) => !p.generated;

/* ---------- Intro onboarding ---------- */
function IntroScreen({ onBegin }) {
  return (
    <div className="intro fade-in">
      <div className="intro-hero">
        <div className="intro-kicker mono">Time Correction Agency · Field Investigator Onboarding</div>
        <h1 className="intro-title">TIME<span className="accent">LINE</span></h1>
        <p className="intro-tagline">History has been edited. You are the correction.</p>
      </div>
      <div className="intro-transmission panel">
        <div className="tx-channel mono">▸ SECURE CHANNEL · ORIGIN: CONTROL</div>
        <TransmissionLog lines={TL.agency.onboarding} />
        <div className="intro-cta ready">
          <button className="btn btn-accent" onClick={onBegin}>Enter the Case Index →</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- Story beat between cases ---------- */
function BeatScreen({ lines, onContinue, isFinal }) {
  return (
    <div className="beat fade-in">
      <div className="intro-transmission panel beat-panel">
        <div className="tx-channel mono">▸ INCOMING · ORIGIN: CONTROL {isFinal ? "· PRIORITY ████" : ""}</div>
        <TransmissionLog lines={lines} />
        <div className="intro-cta ready">
          <button className="btn btn-accent" onClick={onContinue}>{onContinue.label || "Continue →"}</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- Case Index (library hub) ---------- */
function CaseRow({ p, idx, solved, locked, onOpen }) {
  const story = isStory(p);
  return (
    <button
      className={"case-row" + (solved ? " solved" : "") + (locked ? " locked" : "") + (story ? " priority" : "")}
      disabled={locked}
      onClick={() => !locked && onOpen(p.id)}
    >
      <span className="cr-code mono">{p.code}</span>
      <span className="cr-main">
        <span className="cr-title">{p.title}{story && <span className="cr-prio mono">▣ Priority Directive</span>}</span>
        <span className="cr-place mono">{p.place} · {p.eraLabel}</span>
      </span>
      <span className="cr-meta mono">
        <span className="cr-chip">{p.categories[0].items.length}×{p.categories.length}</span>
        <span className="cr-chip">{(p.clues ? p.clues.length : p.clueCount)} clues</span>
      </span>
      <span className="cr-status mono">
        {locked ? "Sealed" : solved ? "✓ Restored" : story ? "Open ▸" : "Open ▸"}
      </span>
    </button>
  );
}

function CaseIndex({ save, onOpen, unlocked }) {
  const tiers = TL.tiers;
  const total = TL.allPuzzles.length;
  const solvedCount = TL.allPuzzles.filter((p) => save.solved[p.id]).length;
  const epilogueReady = !!save.solved.p3;

  return (
    <div className="caseindex fade-in">
      <header className="ci-head">
        <div>
          <div className="ci-kicker mono">Time Correction Agency · Field Dossier</div>
          <h1 className="ci-title">Case Index</h1>
        </div>
        <div className="ci-progress">
          <div className="ci-prog-num mono"><b>{solvedCount}</b> / {total}</div>
          <div className="ci-prog-lbl mono">timelines restored</div>
        </div>
      </header>

      {epilogueReady && (
        <button className="ci-epilogue" onClick={() => onOpen("__epilogue")}>
          <span className="mono">CASE FILE ∞ · UNRESOLVABLE</span>
          <span className="ci-epi-title">The loop is closed. Re-open the final transmission →</span>
        </button>
      )}

      {[1, 2, 3].map((t) => {
        const open = unlocked(t);
        const list = tiers[t];
        const meta = TIER_META[t];
        const solvedInTier = list.filter((p) => save.solved[p.id]).length;
        return (
          <section className={"ci-tier" + (open ? "" : " sealed")} key={t}>
            <div className="ci-tier-head">
              <div className="ci-tier-label">
                <span className="ci-tier-name mono">{meta.label} · {meta.name}</span>
                <span className="ci-tier-note">{meta.note}</span>
              </div>
              <div className="ci-tier-count mono">
                {open ? `${solvedInTier}/${list.length} restored` : `Sealed — clear the Tier ${t - 1} priority directive`}
              </div>
            </div>
            <div className="ci-rows">
              {list.map((p, i) => (
                <CaseRow key={p.id} p={p} idx={i}
                  solved={!!save.solved[p.id]} locked={!open}
                  onOpen={onOpen} />
              ))}
            </div>
          </section>
        );
      })}

      <div className="ci-foot mono">TIMELINE · {total} cases across three tiers · deduction experience · TCA-ARCHIVE</div>
    </div>
  );
}

/* ---------- Epilogue ---------- */
function Epilogue({ onReview, onRestart }) {
  return (
    <div className="epilogue fade-in">
      <div className="epi-card">
        <div className="epi-kicker mono">Case file ∞ · status: UNRESOLVABLE</div>
        <h1 className="epi-title">The loop is closed.<br/>It always was.</h1>
        <p className="epi-body">
          You restored timeline after timeline and uncovered the one fracture that cannot be
          restored — because the hand that broke it is your own. The Agency was founded by the
          investigator it recruited to repair the damage that founding caused.
        </p>
        <p className="epi-body epi-dim">
          There is one fracture left in the vault. It has your name on it, under the redaction.
          You already know what it says.
        </p>
        <div className="epi-actions">
          <button className="btn btn-ghost" onClick={onReview}>Return to Case Index</button>
          <button className="btn btn-accent" onClick={onRestart}>Reopen the loop ↻</button>
        </div>
        <div className="epi-foot mono">TIMELINE · a deduction experience · TCA-ARCHIVE</div>
      </div>
    </div>
  );
}

/* ---------- App ---------- */
function App() {
  const [st, setSt] = useState(loadSave);
  const { phase, currentId, save } = st;
  const puzzle = currentId && TL.byId[currentId] ? TL.byId[currentId] : null;

  useEffect(() => {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(st)); } catch (e) {}
  }, [st]);

  function setPhase(phase, extra = {}) { setSt((s) => ({ ...s, phase, ...extra })); }

  function setMarksFor(pid, fnOrVal) {
    setSt((s) => {
      const prev = s.save.marks[pid] || {};
      const nextMarks = typeof fnOrVal === "function" ? fnOrVal(prev) : fnOrVal;
      return { ...s, save: { ...s.save, marks: { ...s.save.marks, [pid]: nextMarks } } };
    });
  }
  function setFinalFor(pid, obj) {
    setSt((s) => ({ ...s, save: { ...s.save, final: { ...s.save.final, [pid]: obj } } }));
  }
  function useHint(pid) {
    setSt((s) => ({ ...s, save: { ...s.save, hints: { ...s.save.hints, [pid]: Math.min(3, (s.save.hints[pid] || 0) + 1) } } }));
  }
  function addWrong(pid) {
    setSt((s) => ({ ...s, save: { ...s.save, wrong: { ...s.save.wrong, [pid]: (s.save.wrong[pid] || 0) + 1 } } }));
  }
  function markSolved(pid) {
    setSt((s) => ({ ...s, save: { ...s.save, solved: { ...s.save.solved, [pid]: true } } }));
  }

  function unlocked(t) {
    if (t === 1) return true;
    if (t === 2) return !!save.solved.p1;
    if (t === 3) return !!save.solved.p2;
    return false;
  }

  function openCase(id) {
    window.scrollTo(0, 0);
    if (id === "__epilogue") { setPhase("epilogue"); return; }
    setSt((s) => ({ ...s, phase: "puzzle", currentId: id }));
  }
  function toIndex() { window.scrollTo(0, 0); setPhase("library"); }

  function advance() {
    // story puzzles trigger a beat; field cases return to index
    if (puzzle && isStory(puzzle)) { window.scrollTo(0, 0); setPhase("beat"); }
    else toIndex();
  }
  function afterBeat() {
    if (currentId === "p3") { setPhase("epilogue"); }
    else toIndex();
  }
  function restart() {
    if (!confirm("Reopen the loop? This wipes all progress and returns to onboarding.")) return;
    setSt({ phase: "intro", currentId: null, save: { marks: {}, hints: {}, wrong: {}, solved: {}, final: {} } });
    window.scrollTo(0, 0);
  }

  function paradox() {
    if (phase === "intro") return 14;
    if (phase === "epilogue") return 100;
    const total = TL.allPuzzles.length;
    const solvedCount = TL.allPuzzles.filter((p) => save.solved[p.id]).length;
    const global = Math.round(12 + 70 * (1 - solvedCount / total));
    if (phase === "library") return global;
    if (phase === "beat") return currentId === "p3" ? 100 : global;
    // in a puzzle
    if (!puzzle) return global;
    if (save.solved[puzzle.id]) return Math.max(8, Math.round(global * 0.5));
    const base = TL.TIER[puzzle.tier].instability;
    const pen = (save.hints[puzzle.id] || 0) * 3 + (save.wrong[puzzle.id] || 0) * 4;
    return Math.min(99, base + pen);
  }

  return (
    <div>
      <div className="topbar">
        <div className="topbar-in">
          <button className="brand brand-btn" onClick={() => (phase === "intro" ? null : toIndex())} title="Case Index">
            <span className="logo">TIME<b>LINE</b></span>
            <span className="sub">Time Correction Agency</span>
          </button>
          <div className="spacer" />
          {(phase === "puzzle" || phase === "beat") && (
            <button className="btn btn-ghost btn-sm idx-btn" onClick={toIndex}>◀ Case Index</button>
          )}
          {puzzle && (phase === "puzzle") && (
            <span className="cur-case mono">{puzzle.code}</span>
          )}
          <ParadoxMeter value={paradox()} />
          {phase !== "intro" && <button className="reset-btn mono" onClick={restart} title="Restart">↻</button>}
        </div>
      </div>

      <div className="shell stage">
        {phase === "intro" && <IntroScreen onBegin={() => setPhase("library")} />}

        {phase === "library" && (
          <CaseIndex save={save} onOpen={openCase} unlocked={unlocked} />
        )}

        {phase === "puzzle" && puzzle && (
          <PuzzleView
            key={puzzle.id}
            puzzle={puzzle}
            marks={save.marks[puzzle.id] || {}}
            setMarks={(fn) => setMarksFor(puzzle.id, fn)}
            hintsUsed={save.hints[puzzle.id] || 0}
            onUseHint={() => useHint(puzzle.id)}
            solved={!!save.solved[puzzle.id]}
            onSolve={() => markSolved(puzzle.id)}
            finalSel={save.final[puzzle.id] || {}}
            setFinalSel={(obj) => setFinalFor(puzzle.id, obj)}
            onWrong={() => addWrong(puzzle.id)}
            onAdvance={advance}
            isStory={isStory(puzzle)}
            isLast={puzzle.id === "p3"}
          />
        )}

        {phase === "beat" && puzzle && (() => {
          const lines = TL.beats[puzzle.id];
          if (!lines) { afterBeat(); return null; }
          const isFinal = puzzle.id === "p3";
          const cont = () => afterBeat();
          cont.label = isFinal ? "▣ End transmission" : "Return to Case Index →";
          return <BeatScreen lines={lines} onContinue={cont} isFinal={isFinal} />;
        })()}

        {phase === "epilogue" && (
          <Epilogue onReview={toIndex} onRestart={restart} />
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
