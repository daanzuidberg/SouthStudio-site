<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIMELINE — TikTok · Zaak №074 (geanimeerd)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;0,6..72,800;1,6..72,400;1,6..72,500;1,6..72,600&amp;family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #0a0a0a; overflow: hidden; }
  #root { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="../brand/animations.jsx"></script>
<script type="text/babel" src="promo-shared.jsx"></script>
<script type="text/babel" src="tiktok-scene.jsx"></script>

<script type="text/babel">
  function App() {
    const [lang, setLang] = React.useState(() => localStorage.getItem('tt074-lang') || 'nl');
    const pick = (l) => { setLang(l); localStorage.setItem('tt074-lang', l); };
    const btn = (l, label) => (
      <button onClick={() => pick(l)} style={{
        fontFamily: '"IBM Plex Mono", monospace', fontSize: 11, fontWeight: 600,
        letterSpacing: '.14em', textTransform: 'uppercase', cursor: 'pointer',
        padding: '7px 16px', borderRadius: 3,
        border: lang === l ? '1px solid #D2362B' : '1px solid #6F6757',
        background: lang === l ? '#D2362B' : 'transparent',
        color: lang === l ? '#fff' : '#E8E0D0' }}>{label}</button>
    );
    return (
      <div style={{ position: 'fixed', inset: 0, display: 'flex', flexDirection: 'column' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '9px 18px', background: '#26241F', color: '#E8E0D0',
          fontFamily: '"IBM Plex Mono", monospace', fontSize: 11.5, letterSpacing: '.12em',
          textTransform: 'uppercase' }}>
          <div>TIMELINE · TikTok — Zaak №074 · 1080×1920 · 23 s</div>
          <div style={{ display: 'flex', gap: 8 }}>{btn('nl', 'NL')}{btn('en', 'EN')}</div>
        </div>
        <div style={{ flex: 1, position: 'relative' }}>
          <Stage key={lang} width={1080} height={1920} duration={23} background="#120F0C"
            persistKey="tl-tiktok-074">
            <TikScene lang={lang} />
          </Stage>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
