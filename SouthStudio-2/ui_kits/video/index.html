<script type="text/babel">
// Audio segments: [elementId, stageStartTime, stageEndTime]
const VO_SEGMENTS = [
  ['vo-0',   8.6,  50.0],
  ['vo-1',  50.5,  82.0],
  ['vo-2',  82.5, 128.0],
  ['vo-3', 128.5, 165.0],
  ['vo-4', 165.5, 192.0],
];

// Sync audio elements to the Stage playhead (stored in localStorage by the Stage component)
function useAudioSync(persistKey) {
  React.useEffect(() => {
    const els = VO_SEGMENTS.map(([id]) => document.getElementById(id));
    let lastT = -1;
    let lastPlaying = false;

    function tick() {
      try {
        const raw = localStorage.getItem(`${persistKey}:t`);
        const playing = localStorage.getItem(`${persistKey}:playing`) !== 'false';
        const t = parseFloat(raw || '0');
        const seeked = Math.abs(t - lastT) > 0.25;
        lastT = t;

        VO_SEGMENTS.forEach(([id, start, end], i) => {
          const el = els[i];
          if (!el || el.error) return;
          const inRange = t >= start && t < end;
          const localT = t - start;

          if (inRange) {
            if (seeked || Math.abs(el.currentTime - localT) > 0.4) {
              el.currentTime = Math.max(0, localT);
            }
            if (playing && el.paused) el.play().catch(() => {});
            if (!playing && !el.paused) el.pause();
          } else {
            if (!el.paused) el.pause();
          }
        });

        lastPlaying = playing;
      } catch {}
      rafId = requestAnimationFrame(tick);
    }

    let rafId = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafId);
  }, []);
}

function App() {
  useAudioSync('ss-silence');

  React.useEffect(() => {
    const id = setInterval(() => {
      try {
        const t = parseFloat(localStorage.getItem('ss-silence:t') || '0');
        const m = Math.floor(t / 60), s = Math.floor(t % 60);
        const el = document.getElementById('root');
        if (el) el.dataset.screenLabel = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      } catch {}
    }, 1000);
    return () => clearInterval(id);
  }, []);

  return (
    <Stage
      width={STAGE_W}
      height={STAGE_H}
      duration={200}
      background="#FAF7EF"
      loop={false}
      autoplay={true}
      persistKey="ss-silence"
    >
      <SilenceVideo />
    </Stage>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
